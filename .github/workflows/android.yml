name: Android build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  NDK_VERSION: 29.0.14206865
  CARGO_BUILD_JOBS: '3'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    env:
      HERDR_ANDROID_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag before building
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 android-gpui/scripts/check-release-tag.py "$RELEASE_TAG"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install pinned native tools
        run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 '${{ matrix.target }}'
      - name: Host regressions
        run: |
          python3 android-gpui/scripts/test-native-verifier.py
          python3 android-gpui/scripts/test-native-build-record.py
          python3 android-gpui/scripts/test-apk-verifier.py
          sh android/tests/run.sh
          cargo test --locked --manifest-path android-gpui/rust/Cargo.toml
      - name: Build actual GPUI native library
        run: android-gpui/scripts/build-native.sh
      - name: Gradle build and lint
        working-directory: android-gpui
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease
      - name: Verify and collect APKs
        run: android-gpui/scripts/ci-artifacts.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ matrix.abi }}
          path: android-gpui/build/ci/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-${{ matrix.abi }}
          path: android-gpui/app/build/reports/
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure reviewers/tag restrictions before enabling release signing.
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-arm64-v8a
          path: artifacts
      - name: Check tag and artifact checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 android-gpui/scripts/check-release-tag.py "$RELEASE_TAG"
          (cd artifacts && sha256sum --check SHA256SUMS)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: vars.ANDROID_RELEASE_SIGNING_ENABLED == 'true'
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: vars.ANDROID_RELEASE_SIGNING_ENABLED == 'true'
        with:
          cmdline-tools-version: '13114758'
          packages: 'build-tools;35.0.0'
      - name: Sign release with existing identity
        if: vars.ANDROID_RELEASE_SIGNING_ENABLED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: android-gpui/scripts/sign-release.sh
      - name: Create draft preview for manual runtime validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Never replace assets in an existing release or publish automatically.
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --prerelease \
            --title "Android $RELEASE_TAG (validation pending)" \
            --notes-file android-gpui/RELEASE-NOTES.md
