name: Android build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  NDK_VERSION: 29.0.14206865
  CARGO_BUILD_JOBS: '3'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    env:
      HERDR_ANDROID_ABI: ${{ matrix.abi }}
    steps:
      - name: Require SDK license consent
        env:
          SDK_LICENSES_ACCEPTED: ${{ vars.ANDROID_SDK_LICENSES_ACCEPTED }}
        run: |
          if [[ "$SDK_LICENSES_ACCEPTED" != true ]]; then
            echo 'Repository operator must approve Android SDK licenses and set ANDROID_SDK_LICENSES_ACCEPTED=true before CI downloads SDK packages.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag before building
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 android-gpui/scripts/check-release-tag.py "$RELEASE_TAG"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install pinned native tools
        run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 '${{ matrix.target }}'
      - name: Host regressions
        run: |
          python3 android-gpui/scripts/test-native-verifier.py
          python3 android-gpui/scripts/test-native-build-record.py
          python3 android-gpui/scripts/test-apk-verifier.py
          python3 android-gpui/scripts/test-next-preview-release.py
          sh android/tests/run.sh
          cargo test --locked --manifest-path android-remote/rust/Cargo.toml
          sh android-gpui/tests/run-ime.sh
          cargo test --locked --manifest-path android-gpui/rust/Cargo.toml --workspace --features remote
      - name: Build actual GPUI native library
        run: android-gpui/scripts/build-native.sh
      - name: Gradle build and lint
        working-directory: android-gpui
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease
      - name: Compile Android runtime tests
        working-directory: android-gpui
        run: ./gradlew --no-daemon :app:compileVmTests
      - name: Verify and collect APKs
        run: android-gpui/scripts/ci-artifacts.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.abi }}
          path: android-gpui/build/ci/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-${{ matrix.abi }}
          path: android-gpui/app/build/reports/
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure reviewers/tag restrictions before enabling release signing.
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-arm64-v8a
          path: artifacts
      - name: Check tag and artifact checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 android-gpui/scripts/check-release-tag.py "$RELEASE_TAG"
          (cd artifacts && sha256sum --check SHA256SUMS)
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: vars.ANDROID_RELEASE_SIGNING_ENABLED == 'true'
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: vars.ANDROID_RELEASE_SIGNING_ENABLED == 'true'
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: '13114758'
          packages: 'build-tools;35.0.0'
      - name: Sign release with existing identity
        if: vars.ANDROID_RELEASE_SIGNING_ENABLED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: android-gpui/scripts/sign-release.sh
      - name: Create draft preview for manual runtime validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Never replace assets in an existing release or publish automatically.
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --prerelease \
            --title "Android $RELEASE_TAG (validation pending)" \
            --notes-file android-gpui/RELEASE-NOTES.md
  preview:
    # Every successful default-branch build publishes its own unsigned preview
    # release, so an installable build never needs a hand-pushed tag. Stably signed
    # android-v* releases and device validation stay separate manual paths; see
    # android-gpui/RELEASE.md.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # Creates this commit's preview tag and publishes its release
    # Serialize preview publication so two runs cannot race on one release.
    concurrency:
      group: android-preview-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-arm64-v8a
          path: artifacts
      - name: Verify the downloaded artifacts
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$(ls -A artifacts)"
          (cd artifacts && sha256sum --check SHA256SUMS)
          # The release must describe the commit it is tagged with.
          test "$(cat artifacts/SOURCE_COMMIT)" = "$COMMIT"
          for apk in artifacts/*.apk; do
            python3 android-gpui/scripts/verify-apk-structure.py --abi arm64-v8a "$apk"
          done
      - name: Claim the preview release tag
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A re-run of this commit reuses its own release instead of adding another.
          tag="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq "first(.[] | select(.target_commitish == \"$COMMIT\") | select(.tag_name | startswith(\"android-preview-\")) | .tag_name)")"
          if [[ -n "$tag" ]]; then
            echo "Reusing $tag for $COMMIT"
          else
            existing="$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/android-preview-" --jq '.[].ref')"
            candidates="$(printf '%s\n' "$existing" | python3 android-gpui/scripts/next-preview-release.py 10)"
            mapfile -t names <<< "$candidates"
            for name in "${names[@]}"; do
              # Another run may have claimed this number in the meantime.
              if gh api "repos/$GH_REPO/git/ref/tags/$name" >/dev/null 2>&1; then
                continue
              fi
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$name" -f sha="$COMMIT" >/dev/null
              tag="$name"
              break
            done
          fi
          test -n "$tag" || { echo "::error::Could not claim a preview release tag at $COMMIT" >&2; exit 1; }
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)" = "$COMMIT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preview release: $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Create, verify, and publish the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.preview.outputs.tag }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/preview-notes.md"
          {
            cat android-gpui/RELEASE-NOTES.md
            printf '\nUnsigned preview of commit %s, published from the green default-branch build in [workflow run](%s).\n' "$COMMIT" "$RUN_URL"
            printf 'Only a development-signed debug APK and an unsigned release APK are attached: without a stable release identity, an existing installation cannot be updated in place.\n'
            printf 'Stably signed android-v* releases remain a separate, manually validated path.\n'
          } > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
              # A re-run after publication: never rewrite a public release.
              published="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
              missing=()
              for file in artifacts/*; do
                name="$(basename "$file")"
                grep -qxF "$name" <<< "$published" || missing+=("$name")
              done
              if (( ${#missing[@]} > 0 )); then
                echo "::error::Published release $TAG is missing ${missing[*]}; repair it by hand instead of rewriting it." >&2
                exit 1
              fi
              echo "Release $TAG is already published; leaving it untouched."
              echo "Published release: $TAG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Reuse the draft an interrupted run left behind, but replace its whole
            # asset set: mixing generations would leave the draft's own SHA256SUMS
            # disagreeing with the files next to it.
            echo "Draft $TAG exists; replacing its assets with this run's verified set"
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --verify-tag --target "$COMMIT" --draft --prerelease \
              --title "$TAG (unsigned preview)" --notes-file "$notes"
          fi
          # Nothing becomes public until the draft provably holds this run's bytes.
          gh release view "$TAG" --json assets > "$RUNNER_TEMP/assets.json"
          python3 - "$RUNNER_TEMP/assets.json" artifacts <<'PY'
          import hashlib, json, pathlib, sys
          assets = {asset['name']: asset for asset in json.loads(pathlib.Path(sys.argv[1]).read_text())['assets']}
          verified = {item.name: 'sha256:' + hashlib.sha256(item.read_bytes()).hexdigest()
                      for item in sorted(pathlib.Path(sys.argv[2]).glob('*'))}
          missing = sorted(set(verified) - set(assets))
          different = sorted(name for name, digest in verified.items()
                             if name in assets and assets[name]['digest'] != digest)
          if missing or different:
              raise SystemExit(f'Draft assets do not match the verified build: missing={missing} different={different}')
          if extras := sorted(set(assets) - set(verified)):
              print(f'::warning::Draft holds asset(s) this run does not vouch for: {extras}')
          print(f'Draft assets match the verified build: {len(verified)} file(s)')
          PY
          gh release edit "$TAG" --draft=false --prerelease
          echo "Published unsigned preview: $TAG" >> "$GITHUB_STEP_SUMMARY"
