name: Android build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  NDK_VERSION: 29.0.14206865
  CARGO_BUILD_JOBS: '3'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    env:
      HERDR_ANDROID_ABI: ${{ matrix.abi }}
    steps:
      - name: Require SDK license consent
        env:
          SDK_LICENSES_ACCEPTED: ${{ vars.ANDROID_SDK_LICENSES_ACCEPTED }}
        run: |
          if [[ "$SDK_LICENSES_ACCEPTED" != true ]]; then
            echo 'Repository operator must approve Android SDK licenses and set ANDROID_SDK_LICENSES_ACCEPTED=true before CI downloads SDK packages.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag before building
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 android-gpui/scripts/check-release-tag.py "$RELEASE_TAG"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install pinned native tools
        run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 '${{ matrix.target }}'
      - name: Host regressions
        run: |
          python3 android-gpui/scripts/test-native-verifier.py
          python3 android-gpui/scripts/test-native-build-record.py
          python3 android-gpui/scripts/test-apk-verifier.py
          python3 android-gpui/scripts/test-preview-tag.py
          sh android/tests/run.sh
          cargo test --locked --manifest-path android-remote/rust/Cargo.toml
          sh android-gpui/tests/run-ime.sh
          cargo test --locked --manifest-path android-gpui/rust/Cargo.toml --features remote
      - name: Build actual GPUI native library
        run: android-gpui/scripts/build-native.sh
      - name: Gradle build and lint
        working-directory: android-gpui
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease
      - name: Compile Android runtime tests
        working-directory: android-gpui
        run: ./gradlew --no-daemon :app:compileVmTests
      - name: Verify and collect APKs
        run: android-gpui/scripts/ci-artifacts.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ matrix.abi }}
          path: android-gpui/build/ci/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-${{ matrix.abi }}
          path: android-gpui/app/build/reports/
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure reviewers/tag restrictions before enabling release signing.
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-arm64-v8a
          path: artifacts
      - name: Check tag and artifact checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 android-gpui/scripts/check-release-tag.py "$RELEASE_TAG"
          (cd artifacts && sha256sum --check SHA256SUMS)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: vars.ANDROID_RELEASE_SIGNING_ENABLED == 'true'
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: vars.ANDROID_RELEASE_SIGNING_ENABLED == 'true'
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: '13114758'
          packages: 'build-tools;35.0.0'
      - name: Sign release with existing identity
        if: vars.ANDROID_RELEASE_SIGNING_ENABLED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: android-gpui/scripts/sign-release.sh
      - name: Create draft preview for manual runtime validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Never replace assets in an existing release or publish automatically.
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --prerelease \
            --title "Android $RELEASE_TAG (validation pending)" \
            --notes-file android-gpui/RELEASE-NOTES.md
  preview:
    # Every successful default-branch build gets its own unpublished draft, so a
    # validation build never needs a hand-pushed tag. Signing identities and
    # device validation stay manual gates; see android-gpui/RELEASE.md.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # Creates this commit's tag and its unpublished draft release
    # Serialize preview uploads so two runs cannot race on one draft.
    concurrency:
      group: android-preview-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-arm64-v8a
          path: artifacts
      - name: Derive the preview tag
        id: preview
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$(python3 android-gpui/scripts/preview-tag.py "$COMMIT")"
          git check-ref-format "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preview draft tag: $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the downloaded artifacts
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$(ls -A artifacts)"
          (cd artifacts && sha256sum --check SHA256SUMS)
          # The draft must describe the commit it is tagged with.
          test "$(cat artifacts/SOURCE_COMMIT)" = "$COMMIT"
          for apk in artifacts/*.apk; do
            python3 android-gpui/scripts/verify-apk-structure.py --abi arm64-v8a "$apk"
          done
      - name: Create or complete the draft preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.preview.outputs.tag }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/preview-notes.md"
          {
            cat android-gpui/RELEASE-NOTES.md
            printf '\nAutomatic draft preview of commit %s, built by [workflow run](%s).\n' "$COMMIT" "$RUN_URL"
            printf 'Automatic previews never use a release signing identity and never publish.\n'
          } > "$notes"
          title="$TAG (validation pending)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Reuse this commit's draft instead of replacing it. A cancelled run
            # can leave it short of assets, so upload only the gaps.
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || {
              echo "::error::Release $TAG exists and is published; automatic previews never modify a published release." >&2
              exit 1
            }
            declare -A uploaded=()
            while IFS= read -r name; do
              uploaded["$name"]=1
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            missing=()
            for file in artifacts/*; do
              name="$(basename "$file")"
              [[ -n "${uploaded[$name]:-}" ]] || missing+=("$file")
            done
            if (( ${#missing[@]} > 0 )); then
              echo "Uploading ${#missing[@]} asset(s) missing from draft $TAG"
              gh release upload "$TAG" "${missing[@]}"
            else
              echo "Draft $TAG already holds every artifact; nothing to create."
            fi
          elif gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            # A cancelled run can create the tag without its release.
            gh release create "$TAG" artifacts/* --verify-tag --draft --prerelease \
              --title "$title" --notes-file "$notes"
          else
            gh release create "$TAG" artifacts/* --target "$COMMIT" --draft --prerelease \
              --title "$title" --notes-file "$notes"
          fi
          echo "Preview draft: $TAG" >> "$GITHUB_STEP_SUMMARY"
