[package]
name = "herdr-remote-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0"

# Embedded SSH needs an async runtime; it is isolated from the blocking
# generation-1 client worker in this standalone Android workspace.
[workspace]

[dependencies]
base64 = "0.22.1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1.9"

[dev-dependencies]
rand = "0.10"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
