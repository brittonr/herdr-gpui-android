plugins { id 'com.android.application' }

def herdrAndroidAbi = System.getenv('HERDR_ANDROID_ABI') ?: 'arm64-v8a'
if (!(herdrAndroidAbi in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException("Unsupported Android ABI: $herdrAndroidAbi")
}

android {
    namespace 'dev.herdr.android'
    compileSdk 36
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'ch.robitzs.herdr'
        minSdk 29
        targetSdk 36
        versionCode 5
        versionName '0.5.0-gpui-remote'
        ndk { abiFilters herdrAndroidAbi }
    }
    sourceSets {
        main {
            java.srcDirs = ['../../android/app/src/main/java', 'src/main/java']
            res.srcDirs = ['../../android/app/src/main/res']
            assets.srcDirs = ['../../android/app/src/main/assets', 'src/main/assets']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
            keepDebugSymbols += ["**/*.so"]
        }
    }
    buildTypes { release { minifyEnabled false } }
    lint {
        // The UI is English-only by design; every literal is user-facing copy,
        // not an untranslated resource. Other lint families stay enabled.
        disable 'SetTextI18n'
        // The remaining hit is a static final int in the pinned GPUI fork that is
        // inlined at compile time; the fork guards its own API use.
        disable 'InlinedApi'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub that throws on the JVM; hosts-file tests need a real one.
    testImplementation 'org.json:json:20260814'
}

tasks.register('compileVmTests', Exec) {
    dependsOn 'assembleDebug'
    workingDir rootProject.projectDir
    environment 'HERDR_VM_DEBUG_KEYSTORE', android.signingConfigs.debug.storeFile.absolutePath
    commandLine rootProject.file('vm-tests/build.sh').absolutePath
}
